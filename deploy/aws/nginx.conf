# Currently reachable only through SSH; public TLS setup follows separately.
server {
    listen 127.0.0.1:8080;
    server_name _;
    server_tokens off;
    access_log off;
    client_max_body_size 0;

    location ~ ^/(health|add|search)$ {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        # Official Add/Search may take up to 30 minutes; never return a substitute result.
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location / { return 404; }
}
